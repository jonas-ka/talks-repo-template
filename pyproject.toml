[project]
name = "talks-repo"
version = "0.1.0"
description = "Reproducible research-talk slides from a brief plus a curated asset library"
readme = "README.md"
authors = [
    { name = "Your Name", email = "54264819+jonas-ka@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.6.0",
    "cramjam>=2.12.1",
    "fortranformat>=2.0.3",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "iminuit>=2.33.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "mplcursors>=0.7.1",
    "nbclient>=0.11.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "satlas>=0.1.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "typer>=0.27.2",
]

[project.scripts]
talks = "talks_repo.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
