[project]
name = "lablogbook"
version = "2026.10.39"
description = "Log-book entries as Markdown files: format, checker, rendering (lab-templates)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "pillow>=10"]   # pillow: photos from the form (metadata, size)

[project.optional-dependencies]
test = ["pytest>=8"]
epics = ["caproto>=1.1"]        # EPICS snapshots and restore (a machine on the lab's EPICS network)
migrate = ["pymupdf>=1.24"]     # migrating Typst log books: SVG and PNG made from PDF-only figures

[project.scripts]
logbook = "lablogbook.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lablogbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
